name: Build Swmarly Valheim Seed Totem

on:
  push:
    branches: [main, valheim-1.0-port]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VALHEIM_INSTALL: ${{ github.workspace }}/Valheim
      BEPINEX_VERSION: 5.4.2350
      JOTUNN_VERSION: 2.30.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current Valheim Steam build
        id: valheim
        shell: bash
        run: |
          build_id="$(curl --fail --silent https://api.steamcmd.net/v1/info/896660 | jq -r '.data["896660"].depots.branches.public.buildid')"
          test -n "$build_id" && test "$build_id" != "null"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Cache Valheim and BepInEx
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VALHEIM_INSTALL }}
            ~/.steamcmd
          key: valheim-${{ steps.valheim.outputs.build_id }}-bepinex-${{ env.BEPINEX_VERSION }}

      - name: Install SteamCMD
        uses: CyberAndrii/setup-steamcmd@v1

      - name: Install BepInExPack Valheim
        shell: bash
        run: |
          if [ ! -f "$VALHEIM_INSTALL/BepInEx/core/BepInEx.dll" ]; then
            mkdir -p "$VALHEIM_INSTALL"
            curl --fail --location --silent --show-error \
              -o /tmp/bepinex.zip \
              "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/${BEPINEX_VERSION}/"
            unzip -q /tmp/bepinex.zip -d /tmp/bepinex
            cp -a /tmp/bepinex/BepInExPack_Valheim/. "$VALHEIM_INSTALL/"
          fi

      - name: Install current Valheim dedicated server
        shell: bash
        run: |
          if [ ! -f "$VALHEIM_INSTALL/valheim_server_Data/Managed/assembly_valheim.dll" ] && [ ! -f "$VALHEIM_INSTALL/valheim_Data/Managed/assembly_valheim.dll" ]; then
            installed=0
            for attempt in 1 2 3; do
              if steamcmd +force_install_dir "$VALHEIM_INSTALL" +login anonymous +app_info_update 1 +app_info_print 896660 +app_update 896660 validate +quit; then
                installed=1
                break
              fi
              echo "SteamCMD install attempt $attempt failed; retrying"
              sleep 5
            done
            test "$installed" = 1
          fi
          if [ -d "$VALHEIM_INSTALL/valheim_server_Data" ] && [ ! -d "$VALHEIM_INSTALL/valheim_Data" ]; then
            mv "$VALHEIM_INSTALL/valheim_server_Data" "$VALHEIM_INSTALL/valheim_Data"
          fi

      - name: Generate publicized Valheim references
        shell: bash
        run: |
          mkdir -p "$VALHEIM_INSTALL/valheim_Data/Managed"
          rm -rf "$VALHEIM_INSTALL/valheim_Data/Managed/publicized_assemblies"
          printf '%s\n' '<Project><PropertyGroup><ExecutePrebuild>true</ExecutePrebuild></PropertyGroup></Project>' > DoPrebuild.props
          dotnet restore SeedTotem.csproj

      - name: Build plugin
        shell: bash
        run: |
          dotnet build SeedTotem.csproj --configuration Release --no-restore \
            -p:SkipDeploy=true

      - name: Assemble Thunderstore package
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/SeedTotem/plugins/SeedTotem
          cp "bin/Release/SeedTotem.dll" dist/SeedTotem/plugins/SeedTotem/
          cp -a Assets/. dist/SeedTotem/plugins/SeedTotem/
          cp package/manifest.json package/README.md package/CHANGELOG.md package/icon.png dist/SeedTotem/
          (cd dist/SeedTotem && zip -qr "$GITHUB_WORKSPACE/SwmarlyValheimSeedTotem-4.3.13-Thunderstore.zip" .)
          unzip -l "$GITHUB_WORKSPACE/SwmarlyValheimSeedTotem-4.3.13-Thunderstore.zip"

      - name: Upload Thunderstore ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SwmarlyValheimSeedTotem-4.3.13-Thunderstore
          path: dist/SeedTotem/*
          if-no-files-found: error
